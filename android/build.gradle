allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

subprojects {
    // 1. 注入 flutter 扩展，修复 share_plus 等插件找不到 flutter.compileSdkVersion 的问题
    project.ext.set("flutter", [
        compileSdkVersion: 36,
        minSdkVersion: 21,
        targetSdkVersion: 36
    ])

    // 2. 自动修复缺少 namespace 的插件
    project.plugins.configureEach { plugin ->
        if (plugin.class.name.contains("com.android.build.gradle.LibraryPlugin")) {
            project.android {
                if (namespace == null) {
                    // 根据插件名设置正确的 namespace，防止与 AndroidManifest.xml 冲突
                    if (project.name.contains("cryptography_flutter")) {
                        namespace = "dev.dint.cryptography_flutter"
                    } else if (project.name.contains("share_plus")) {
                        namespace = "dev.fluttercommunity.plus.share"
                    } else {
                        namespace = "fix." + project.name.replace("-", ".")
                    }
                }
                // 统一编译版本
                compileSdk 34
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
