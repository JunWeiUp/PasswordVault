<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PasswordVault Passkey QA</title>
<style>body{font:18px system-ui;padding:24px}button{display:block;font:inherit;padding:16px;margin:16px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<h1>Synthetic passkey QA</h1><p>This fixture stores only a public key and credential ID in this browser. No server account is created.</p>
<button id="create">Create synthetic passkey</button><button id="get">Use synthetic passkey</button><pre id="status" role="status">Ready</pre>
<script>
const status=document.querySelector('#status');
const b64=bytes=>btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
function cbor(data){let i=0;function read(){const start=data[i++],kind=start>>5;let n=start&31;if(n===24)n=data[i++];else if(n===25)n=(data[i++]<<8)|data[i++];if(kind===0)return n;if(kind===1)return -1-n;if(kind===2){const bytes=data.slice(i,i+n);i+=n;return bytes;}if(kind===3){const bytes=data.slice(i,i+n);i+=n;return new TextDecoder().decode(bytes);}if(kind===5){const m=new Map();for(let j=0;j<n;j++){const key=read();m.set(key,read());}return m;}throw Error('Unsupported CBOR');}return read();}
function checkClient(bytes,challenge,type){const c=JSON.parse(new TextDecoder().decode(bytes));if(c.type!==type||c.challenge!==b64(challenge)||c.origin!==location.origin)throw Error('Client data mismatch');}
async function checkAuth(bytes){const expected=new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(location.hostname)));if(!expected.every((v,i)=>v===bytes[i])||(bytes[32]&5)!==5)throw Error('RP or verification flag mismatch');}
create.onclick=async()=>{try{status.textContent='Creating…';const challenge=crypto.getRandomValues(new Uint8Array(32));const credential=await navigator.credentials.create({publicKey:{challenge,rp:{id:location.hostname,name:'PasswordVault QA'},user:{id:new TextEncoder().encode('synthetic-provider-user'),name:'synthetic@example.test',displayName:'Synthetic QA'},pubKeyCredParams:[{type:'public-key',alg:-7}],authenticatorSelection:{residentKey:'required',userVerification:'required'},attestation:'none',timeout:300000}});checkClient(credential.response.clientDataJSON,challenge,'webauthn.create');const object=cbor(new Uint8Array(credential.response.attestationObject)),auth=object.get('authData');await checkAuth(auth);const length=(auth[53]<<8)|auth[54],key=cbor(auth.slice(55+length));const jwk={kty:'EC',crv:'P-256',x:b64(key.get(-2)),y:b64(key.get(-3)),ext:true};localStorage.setItem('pv-qa-public',JSON.stringify({id:credential.id,jwk}));status.textContent='Registration PASS: public key and verified RP accepted';}catch(error){status.textContent='Registration FAIL: '+error;}};
get.onclick=async()=>{try{const saved=JSON.parse(localStorage.getItem('pv-qa-public')||'null');if(!saved)throw Error('Register first');status.textContent='Signing…';const challenge=crypto.getRandomValues(new Uint8Array(32));const credential=await navigator.credentials.get({publicKey:{rpId:location.hostname,challenge,allowCredentials:[{type:'public-key',id:unb64(saved.id)}],userVerification:'required',timeout:300000}});checkClient(credential.response.clientDataJSON,challenge,'webauthn.get');const auth=new Uint8Array(credential.response.authenticatorData);await checkAuth(auth);const digest=new Uint8Array(await crypto.subtle.digest('SHA-256',credential.response.clientDataJSON));const signed=new Uint8Array(auth.length+digest.length);signed.set(auth);signed.set(digest,auth.length);const der=new Uint8Array(credential.response.signature);let offset=3;const rlen=der[offset++],r=der.slice(offset,offset+rlen);offset+=rlen+1;const slen=der[offset++],s=der.slice(offset,offset+slen);const raw=new Uint8Array(64);raw.set(r.slice(-32),32-Math.min(32,r.length));raw.set(s.slice(-32),64-Math.min(32,s.length));const key=await crypto.subtle.importKey('jwk',saved.jwk,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);if(!await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},key,raw,signed))throw Error('Signature invalid');status.textContent='Assertion PASS: signature, challenge, RP and UV verified';}catch(error){status.textContent='Assertion FAIL: '+error;}};
</script>
