<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Plaintext password signup</title>
<style>body{font:16px system-ui;margin:30px}input,button{display:block;margin:16px;padding:10px;width:320px}</style>
<form id="signup"><input type="text" name="username" class="form-control" placeholder="用户名，支持中文"><input type="text" name="password" class="form-control" placeholder="设置登录密码"><input type="email" name="email" class="form-control" placeholder="邮箱"><label for="email_captcha">邮箱验证码</label><input type="text" name="email_captcha" id="email_captcha" class="form-control" placeholder="邮箱验证码"><button type="button">发送验证码</button><button type="submit">注册</button></form>
<form id="login"><input type="text" name="account" placeholder="账号"><input type="text" name="pwd" placeholder="请输入密码"><input type="text" name="search" placeholder="搜索"><button type="submit">登录</button></form>
<script>
window.qa={requests:[]};window.chrome={runtime:{id:'synthetic-text-password',onMessage:{addListener(){}},async sendMessage(r){qa.requests.push({...r});if(r.action==='inline-availability')return {ok:true,data:{count:0}};return {ok:true,data:r.action==='login-pending'?{enabled:true,pending:false}:{pending:false}}}}};
for(const f of document.forms)f.onsubmit=e=>e.preventDefault();
</script><script src="../../dist/login-observer.js"></script><script src="../../dist/inline-fields.js"></script></html>
