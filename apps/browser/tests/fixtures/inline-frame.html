<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>嵌入登录夹具</title>
<style>body{font:14px system-ui;margin:24px}.login{max-width:330px}.field{position:relative;margin:12px 0}input{box-sizing:border-box;width:100%;height:42px;padding:10px;border:1px solid #ccd6eb;border-radius:7px}.eye{position:absolute;right:8px;top:11px;width:22px;height:20px;cursor:pointer}button{padding:10px;background:#7754ff;color:white;border:0;border-radius:6px;width:100%}</style>
<h2>无 form 的嵌入登录框</h2><div class="login"><div class="field"><input id="account" placeholder="请输入手机号码或邮箱"></div><div class="field"><input id="secret" type="password" autocomplete="off" placeholder="请输入密码"><div class="eye" role="button" tabindex="0" aria-label="显示或隐藏密码"><svg width="22" height="20"><ellipse cx="11" cy="10" rx="10" ry="6" fill="none" stroke="#888"/><circle cx="11" cy="10" r="3" fill="#888"/></svg></div></div><button id="login">登录（测试，不提交）</button></div>
<script>document.body.dataset.submits="0";document.querySelector('.eye').onclick=()=>{const i=document.querySelector('#secret');i.type=i.type==='password'?'text':'password'};document.querySelector('#login').onclick=()=>document.body.dataset.submits=String(Number(document.body.dataset.submits)+1);</script></html>
