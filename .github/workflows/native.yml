name: Native clients
on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: native-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Select changed components
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core: ${{ steps.select.outputs.core }}
      macos: ${{ steps.select.outputs.macos }}
      browser: ${{ steps.select.outputs.browser }}
      android: ${{ steps.select.outputs.android }}
      ios: ${{ steps.select.outputs.ios }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        run: python3 tool/ci_changes.py

  native-core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-rust-cache
        with:
          component: core
      - run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
      - run: bash tool/check_native.sh core
  android-native:
    name: Build Android development APK
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-rust-cache
        with:
          component: android
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install native targets and Android tools
        run: |
          rustup toolchain install 1.96.0 --profile minimal --target aarch64-linux-android
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.0.12077973'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/shared/note-editor/package-lock.json
      - run: bash tool/build_mobile_core.sh android
        env:
          PASSWORDVAULT_ANDROID_ABI: arm64-v8a
      - name: Build isolated preview and test applications
        run: |
          ./apps/android/gradlew -p apps/android :app:assembleCompact :app:assembleCompactAndroidTest :login-fixture:assembleDebug -PtestBuildType=compact -PtargetAbi=arm64-v8a
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-android-developer-preview
          path: |
            apps/android/app/build/outputs/apk/compact/*.apk
            apps/android/app/build/outputs/apk/androidTest/compact/*.apk
            apps/android/login-fixture/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
  ios-native:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-rust-cache
        with:
          component: ios
      - name: Install native targets and project generator
        run: |
          case "$(uname -m)" in
            arm64) simulator_target=aarch64-apple-ios-sim ;;
            x86_64) simulator_target=x86_64-apple-ios ;;
            *) echo 'Unsupported runner architecture' >&2; exit 1 ;;
          esac
          rustup toolchain install 1.96.0 --profile minimal --target "aarch64-apple-ios,$simulator_target"
          brew install xcodegen
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/shared/note-editor/package-lock.json
      - run: bash tool/build_mobile_core.sh ios
        env:
          PASSWORDVAULT_IOS_SIM_ARCH: host
      - name: Compile app, extension and run isolated lifecycle tests
        run: |
          xcodegen generate --spec apps/ios/project.yml
          xcodebuild -version
          sdk_version=$(xcrun --sdk iphonesimulator --show-sdk-version)
          simulator_id=$(xcrun simctl list devices available -j | python3 tool/select_ios_simulator.py --sdk "$sdk_version")
          xcodebuild -project apps/ios/PasswordVault.xcodeproj -scheme PasswordVault -configuration Debug -derivedDataPath apps/ios/build -destination "platform=iOS Simulator,id=$simulator_id" -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 300 test
      - name: Preserve failed iOS test diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-ios-test-diagnostics
          path: apps/ios/build/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
      - name: Package simulator application preserving executable permissions
        run: ditto -c -k --sequesterRsrc --keepParent apps/ios/build/Build/Products/Debug-iphonesimulator/PasswordVault.app apps/ios/build/PasswordVault-ios-simulator.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-ios-simulator-preview
          path: apps/ios/build/PasswordVault-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14

  macos-nsh:
    name: Current Mac NSH
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-rust-cache
        with:
          component: macos-nsh
      - name: Install pinned NSH and Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          curl --fail --show-error --silent --location https://nsh.dev/install.sh -o "$RUNNER_TEMP/nsh-install.sh"
          NSH_VERSION=v0.4.0 NSH_INSTALL_DIR="$HOME/.nsh-0.4.0" sh "$RUNNER_TEMP/nsh-install.sh"
      - run: bash tool/nsh_mac.sh check
      - name: Synthetic-vault native and interface tests
        run: |
          source tool/cargo_fork_env.sh
          export RUSTUP_TOOLCHAIN=1.98.0
          PASSWORDVAULT_VAULT_DIRECTORY="$(mktemp -d /tmp/pv-ci.XXXXXX)/vault"
          export PASSWORDVAULT_VAULT_DIRECTORY
          cargo run --manifest-path apps/macos-nsh/Cargo.toml --example seed -- "$PASSWORDVAULT_VAULT_DIRECTORY"
          bash tool/nsh_mac.sh test
      - run: bash tool/macos-nsh/package-ci.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-macos-nsh-developer-preview
          path: native-test-output/release/PasswordVault-macos-arm64.zip
          if-no-files-found: error
          retention-days: 14

  browser-native:
    name: Build Web and Chromium extension
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-rust-cache
        with:
          component: browser
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/browser/package-lock.json
      - name: Install Rust target
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy --target wasm32-unknown-unknown
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: wasm-tool
        with:
          path: ~/.cargo/bin/wasm-bindgen*
          key: wasm-bindgen-${{ runner.os }}-${{ runner.arch }}-0.2.128
      - name: Install pinned WASM tool
        if: steps.wasm-tool.outputs.cache-hit != 'true'
        run: |
          export RUSTUP_TOOLCHAIN=1.96.0
          source tool/cargo_fork_env.sh
          cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - run: bash tool/check_native.sh browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lightweight-browser-developer-preview
          path: apps/browser/dist
          if-no-files-found: error
          retention-days: 14

  capability-services:
    name: Share and browser relay services
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            services/share/package-lock.json
            services/sync-gateway/package-lock.json
      - run: npm --prefix services/share ci
      - run: npm --prefix services/share run check
      - run: npm --prefix services/share test
      - run: npm --prefix services/sync-gateway ci
      - run: npm --prefix services/sync-gateway test

  native-validation:
    name: Analyze, test, and validate
    if: always()
    needs: [changes, native-core, macos-nsh, android-native, ios-native, browser-native, capability-services]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful applicable native checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = {name: job['result'] for name, job in results.items() if job['result'] not in ('success', 'skipped')}
          if failed:
              raise SystemExit(f'Native validation failed: {failed}')
          if results['changes']['result'] != 'success':
              raise SystemExit('Component selection did not succeed')
          print('All applicable native checks passed')
          PYCODE
