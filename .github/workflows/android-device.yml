name: Signed Android device update
on:
  push:
    tags: ['v*-android.*']
  workflow_dispatch:
    inputs:
      run_tests:
        description: Also run core tests before signing
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-device-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact Android device tag and validate source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 tool/validate_release_ref.py --android-device
          bash tool/check.sh repo
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/build-signed-android
        with:
          run_core_tests: ${{ inputs.run_tests }}
          android_keystore_base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          android_store_password: ${{ secrets.ANDROID_STORE_PASSWORD }}
          android_key_alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          android_key_password: ${{ secrets.ANDROID_KEY_PASSWORD }}
          android_cert_sha256: ${{ secrets.ANDROID_CERT_SHA256 }}
      - name: Record build revision and checksums
        run: |
          git rev-parse HEAD > release-input/COMMIT.txt
          cp native-version.json release-input/BUILD.json
          cd release-input
          sha256sum -- *.apk > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-signed-android-device
          path: release-input/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
