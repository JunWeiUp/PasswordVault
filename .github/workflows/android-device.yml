name: Signed Android device update
on:
  push:
    tags: ['v*-android.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-device-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact Android device tag and validate source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 tool/validate_release_ref.py --android-device
          bash tool/check.sh repo
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/ci-rust-cache
        with:
          component: android
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned native targets
        run: |
          rustup toolchain install 1.96.0 --profile minimal --target aarch64-linux-android,x86_64-linux-android
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.0.12077973'
      - run: bash tool/check_native.sh core
      - run: bash tool/build_mobile_core.sh android
      - name: Configure private signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tool/configure_signing.py
      - name: Build non-debuggable signed APKs
        run: |
          mkdir release-input
          for abi in arm64-v8a x86_64; do
            ./apps/android/gradlew -p apps/android :app:assemblePreviewRelease -PtargetAbi="$abi"
            cp apps/android/app/build/outputs/apk/previewRelease/app-previewRelease.apk "release-input/android-$abi.apk"
          done
      - name: Verify signatures, package identity, versions and architectures
        env:
          ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: python3 tool/native_release.py android
      - name: Record build revision and checksums
        run: |
          git rev-parse HEAD > release-input/COMMIT.txt
          cp native-version.json release-input/BUILD.json
          cd release-input
          sha256sum -- *.apk > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-signed-android-device
          path: release-input/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Remove ephemeral signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/passwordvault-release.jks"
