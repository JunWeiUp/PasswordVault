name: Native release
on:
  push:
    tags: ['v*', '!v1.*', '!v*-android.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed native tag; select the same tag as workflow ref
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: native-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 tool/validate_release_ref.py --native
      - name: Validate coordinated versions and repository regressions
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          python3 tool/native_release.py versions
          bash tool/check.sh repo
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  checks:
    needs: prepare
    uses: ./.github/workflows/native.yml
    with:
      component: release
      run_tests: false
  android:
    needs: prepare
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/build-signed-android
        with:
          android_keystore_base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          android_store_password: ${{ secrets.ANDROID_STORE_PASSWORD }}
          android_key_alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          android_key_password: ${{ secrets.ANDROID_KEY_PASSWORD }}
          android_cert_sha256: ${{ secrets.ANDROID_CERT_SHA256 }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-signed-android
          path: release-input/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  publish:
    needs: [prepare, checks, android]
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-*
          path: downloaded
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: lightweight-browser-developer-preview
          path: release-input/browser
      - name: Stage only the intended public artifacts
        run: |
          cp downloaded/native-signed-android/*.apk release-input/
          cp downloaded/native-macos-nsh-developer-preview/*.zip release-input/
          cp downloaded/native-ios-simulator-preview/*.zip release-input/
          cp downloaded/native-windows-desktop/*.zip release-input/
      - name: Package five downloads and internal verification records
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          python3 tool/native_release.py package
          python3 tool/native_release.py verify --inputs release_assets
      - name: Recheck tag before publication
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          CHECKED_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: python3 tool/validate_release_ref.py --native
      - name: Publish regular GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" release_assets/*.apk release_assets/*.zip --verify-tag --latest \
            --title "PasswordVault $RELEASE_TAG" --notes-file config/release/NOTES.md
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,url \
            --jq 'if .isDraft or .isPrerelease then error("Expected published regular release") else .url end' >> "$GITHUB_STEP_SUMMARY"
