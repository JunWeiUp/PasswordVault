name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  package:
    name: Build signed release assets
    needs: checks
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/setup-flutter
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Validate version and tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tool/check_repository.py --release
      - name: Configure private signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tool/configure_signing.py
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --release --split-per-abi --no-pub
      - run: flutter build appbundle --release --no-pub
      - name: Verify Android signing identity
        env:
          ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: python3 tool/verify_android_signatures.py
      - run: ./build_extension.sh
      - name: Stage packages and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tool/package_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: release_assets/*
          if-no-files-found: error
          retention-days: 7
      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/passwordvault-release.jks"

  publish:
    name: Create draft prerelease
    needs: package
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: release_assets
      - name: Create reviewable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release_assets/* \
            --verify-tag --draft --prerelease \
            --title "PasswordVault $RELEASE_TAG — Developer preview" \
            --notes-file docs/RELEASE_NOTES.md
