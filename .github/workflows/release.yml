name: Release

# 推送形如 v1.2.3 的标签时：跑检查、构建多种产物，并创建 GitHub Release 上传。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 与 android/app/build.gradle 中 ndkVersion 一致；避免每次 runner 冷启动都重新下载 NDK（常占数分钟）。
      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/27.0.12077973
          key: android-ndk-27.0.12077973-${{ runner.os }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      # 未提交 key.properties：Android 均为 debug；正式签名请在本地或配置 Secrets 后扩展。
      - name: Prepare release assets directory
        run: mkdir -p release_assets

      - name: Build APK (debug, universal)
        run: flutter build apk --debug

      - name: Stage Android universal APK
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk \
            "release_assets/PasswordVault-${{ github.ref_name }}-android-universal-debug.apk"

      - name: Build APK (debug, split per ABI)
        run: flutter build apk --debug --split-per-abi

      - name: Stage Android per-ABI APKs
        run: |
          shopt -s nullglob
          for f in build/app/outputs/flutter-apk/app-*-debug.apk; do
            base=$(basename "$f" .apk)
            [[ "$base" == "app-debug" ]] && continue
            abi=${base#app-}
            abi=${abi%-debug}
            cp "$f" "release_assets/PasswordVault-${{ github.ref_name }}-android-${abi}-debug.apk"
          done

      - name: Build Web + Chrome extension (build_extension.sh)
        run: bash build_extension.sh

      - name: Zip Web & Chrome extension
        run: |
          (cd build/web && zip -r "${GITHUB_WORKSPACE}/release_assets/PasswordVault-${{ github.ref_name }}-web.zip" .)
          (cd build && zip -r "${GITHUB_WORKSPACE}/release_assets/PasswordVault-${{ github.ref_name }}-chrome-extension.zip" chrome_extension)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 附件说明

            | 文件 | 说明 |
            | --- | --- |
            | `PasswordVault-<tag>-android-universal-debug.apk` | Android 通用包（debug，无 Play 签名） |
            | `PasswordVault-<tag>-android-*-debug.apk` | 按 CPU 架构拆分，体积更小 |
            | `PasswordVault-<tag>-web.zip` | 独立部署的 Flutter Web（`build_extension.sh` 同次构建产物） |
            | `PasswordVault-<tag>-chrome-extension.zip` | 解压后在 Chrome「加载已解压的扩展程序」中选 `chrome_extension` 目录 |

            可上架的 **release** 包请在本地使用 `key.properties` 构建，或在仓库中配置 Android 签名 Secrets 后扩展本 workflow。
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
