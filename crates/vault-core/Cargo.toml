[package]
name = "vault-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = ["native"]
native = ["dep:rusqlite", "dep:uniffi", "dep:tempfile", "dep:fs2"]
bindgen = ["native", "uniffi/cli"]
browser = ["dep:wasm-bindgen", "getrandom/js"]

[dependencies]
aes-gcm = "0.10.3"
argon2 = "0.5.3"
base64 = "0.22.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
csv = "1.3"
bip39 = { version = "2.2.0", features = ["zeroize"] }
bip32 = { version = "0.5.3", default-features = false, features = ["std", "secp256k1"] }
sha3 = "0.10.8"
data-encoding = "2.9"
getrandom = "0.2.16"
hex = "0.4.3"
hkdf = "0.12.4"
hmac = "0.12.1"
rand = "0.8.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10.6"
sha2 = "0.10.9"
thiserror = "2"
url = "2.5"
zeroize = { version = "1.8", features = ["derive"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
web-time = "1"
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"], optional = true }
uniffi = { version = "0.29.4", optional = true }
tempfile = { version = "3", optional = true }
fs2 = { version = "0.4", optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/bindgen.rs"
required-features = ["bindgen"]
