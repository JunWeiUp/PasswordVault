[workspace]
members = ["crates/vault-core"]
resolver = "2"

# Keep local Debug/test artifacts small while keeping fast incremental rebuilds.
[profile.dev]
debug = 0
strip = "debuginfo"

# Optimize dependencies (crypto/SQLCipher) once so dev tests run near release speed.
[profile.dev.package."*"]
opt-level = 2

# Prefer smaller release code while retaining loop vectorization for crypto.
[profile.release]
opt-level = "s"
debug = 0
incremental = false
lto = "thin"
codegen-units = 1
# Keep symbols needed by native static linking and the UniFFI tooling.
strip = "debuginfo"
